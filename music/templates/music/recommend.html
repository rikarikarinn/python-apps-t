<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音楽おすすめ</title>
</head>
<body>
    <h1>おすすめの音楽</h1>

    {% if track %}
        <p>曲名: {{ track.name }}</p>
        <p>アーティスト: {{ track.artist }}</p>
        <p>URL: <a href="{{ track.url }}" target="_blank">こちら</a></p>
    {% else %}
        <p>おすすめがありません</p>
    {% endif %}

</body>
</html>
